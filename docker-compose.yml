name: feedrank

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
      POSTGRES_DB: search
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<version>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    # Everything in Redis can be rebuilt, so persistence is off and memory is
    # capped with LRU eviction.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://search:search@postgres:5432/search?sslmode=disable
      REDIS_ADDR: redis:6379
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      # Required by the app, which refuses to start without them. They are not
      # enforced here, or even `docker compose down` would demand them.
      PROVIDER1_URL: ${PROVIDER1_URL:-}
      PROVIDER2_URL: ${PROVIDER2_URL:-}
      # Optional tuning from .env; an empty value means the app's default.
      INGEST_INTERVAL: ${INGEST_INTERVAL:-}
      INGEST_TIMEOUT: ${INGEST_TIMEOUT:-}
      PROVIDER_PAGE_SIZE: ${PROVIDER_PAGE_SIZE:-}
      PROVIDER_MAX_PAGES: ${PROVIDER_MAX_PAGES:-}
      PROVIDER_REQUESTS_PER_SECOND: ${PROVIDER_REQUESTS_PER_SECOND:-}
      CACHE_TTL: ${CACHE_TTL:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:
